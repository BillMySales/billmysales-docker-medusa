# Medusa stack: Caddy (TLS) + Medusa (own image built from image/: server with
# the admin, and a worker) + PostgreSQL + Redis, with a setup job and optional
# backups and Mailpit.
#
# Quick start (development):
#   cp .env.dev.example .env
#   docker compose up -d --build
#   docker compose logs -f setup   # wait for "==> Done"
#
# Production: start from .env.prod.example instead. See README.md.
#
# Required variables have no default: compose refuses to start without them.

name: ${COMPOSE_PROJECT_NAME:-medusa}

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-3}"

# The Medusa image (image/Dockerfile), shared by setup, medusa and worker.
x-medusa: &medusa
  image: ${MEDUSA_IMAGE:-medusa-stack}:${MEDUSA_VERSION:-2.21.1}-node${NODE_VERSION:-24}
  build:
    context: ./image
    args:
      MEDUSA_VERSION: ${MEDUSA_VERSION:-2.21.1}
      NODE_VERSION: ${NODE_VERSION:-24}
  logging: *logging
  volumes:
    - static:/app/static

x-medusa-env: &medusa-env
  # Medusa uses SSL for any database host but localhost unless sslmode says
  # otherwise; the stack's PostgreSQL is on the internal network.
  DATABASE_URL: postgres://${DB_USER:-medusa}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/${DB_NAME:-medusa}?sslmode=${DB_SSLMODE:-disable}
  REDIS_URL: redis://redis:6379
  MEDUSA_URL: ${MEDUSA_URL:?Set MEDUSA_URL in .env (e.g. https://shop.example.com)}
  MEDUSA_STORE_CORS: ${MEDUSA_STORE_CORS:-}
  MEDUSA_STOREFRONT_URL: ${MEDUSA_STOREFRONT_URL:-}
  MEDUSA_JWT_SECRET: ${MEDUSA_JWT_SECRET:?Set MEDUSA_JWT_SECRET in .env}
  MEDUSA_COOKIE_SECRET: ${MEDUSA_COOKIE_SECRET:?Set MEDUSA_COOKIE_SECRET in .env}
  MEDUSA_STORE_NAME: ${MEDUSA_STORE_NAME:-Medusa Store}
  MEDUSA_LOCALE: ${MEDUSA_LOCALE:-es-CL}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-tls}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}

services:
  db:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${DB_NAME:-medusa}
      POSTGRES_USER: ${DB_USER:-medusa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      # PostgreSQL 18+ images keep their data under /var/lib/postgresql/<major>.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-1g}

  redis:
    image: redis:${REDIS_VERSION:-8.6}-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256m}

  # One-shot job: migrations, admin user, initial store settings. Safe to
  # repeat; runs on every `up`.
  setup:
    <<: *medusa
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *medusa-env
      MEDUSA_WORKER_MODE: server
      MEDUSA_ADMIN_EMAIL: ${MEDUSA_ADMIN_EMAIL:?Set MEDUSA_ADMIN_EMAIL in .env}
      MEDUSA_ADMIN_PASSWORD: ${MEDUSA_ADMIN_PASSWORD:?Set MEDUSA_ADMIN_PASSWORD in .env}
      MEDUSA_CURRENCY: ${MEDUSA_CURRENCY:-clp}
      MEDUSA_COUNTRY: ${MEDUSA_COUNTRY:-cl}
      MEDUSA_REGION_NAME: ${MEDUSA_REGION_NAME:-Chile}
      MEDUSA_TAX_RATE: ${MEDUSA_TAX_RATE-19}
      MEDUSA_TAX_NAME: ${MEDUSA_TAX_NAME:-IVA}
      MEDUSA_TAX_CODE: ${MEDUSA_TAX_CODE:-iva}
      MEDUSA_PRICES_INCLUDE_TAX: ${MEDUSA_PRICES_INCLUDE_TAX:-true}
      MEDUSA_STOCK_LOCATION: ${MEDUSA_STOCK_LOCATION:-Bodega}
      MEDUSA_CITY: ${MEDUSA_CITY:-Santiago}
      MEDUSA_MIGRATE_UNSAFE: ${MEDUSA_MIGRATE_UNSAFE:-}
    volumes:
      - static:/app/static
      - ./scripts:/usr/local/share/stack/scripts:ro
    command: ["sh", "/usr/local/share/stack/scripts/setup.sh"]
    deploy:
      resources:
        limits:
          memory: ${SETUP_MEMORY_LIMIT:-1g}

  # Medusa server: Store and Admin APIs, the admin (/app) and uploads (/static).
  medusa:
    <<: *medusa
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      <<: *medusa-env
      MEDUSA_WORKER_MODE: server
    # Lets Medusa reach services on the host (e.g. an app running locally)
    # at http://host.docker.internal:<port>, also on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${MEDUSA_MEMORY_LIMIT:-1g}

  # Background work: subscribers (emails), scheduled jobs, workflows.
  worker:
    <<: *medusa
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      <<: *medusa-env
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "grep -q medusa /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-768m}

  caddy:
    image: caddy:${CADDY_VERSION:-2.11}-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      medusa:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-50M}
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:443"
      - "${HTTP_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # TLS certificates and keys (keep them: ACME rate limits).
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEMORY_LIMIT:-256m}

  # Optional (profile "backup"): database dump + uploads every
  # BACKUP_INTERVAL_HOURS, kept BACKUP_KEEP_DAYS days in the `backups` volume
  # (overrides/local-dirs.yaml puts them in a local directory instead).
  backup:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    profiles: ["backup"]
    restart: unless-stopped
    logging: *logging
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-medusa}
      DB_USER: ${DB_USER:-medusa}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      # Read-write so `backup.sh restore` can put the uploads back.
      - static:/static
      - backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["bash", "/usr/local/bin/backup.sh"]
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/backup.sh", "health"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    deploy:
      resources:
        limits:
          memory: ${BACKUP_MEMORY_LIMIT:-512m}

  # Optional (profile "mailpit", development): catches all outgoing mail.
  # Set SMTP_HOST=mailpit and SMTP_PORT=1025; web UI on MAILPIT_PORT.
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.31}
    profiles: ["mailpit"]
    restart: unless-stopped
    logging: *logging
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${MAILPIT_PORT:-8025}:8025"

volumes:
  db_data:
  redis_data:
  static:
  caddy_data:
  caddy_config:
  backups:
